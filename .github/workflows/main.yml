# Сборка установщиков Windows (.exe) и macOS (.dmg) и публикация их в Releases.
# Запускается сама при каждой загрузке файлов в репозиторий
# или вручную: вкладка Actions → «Сборка приложения» → Run workflow.
name: Сборка приложения
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26, macos-26-intel, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: macOS
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: setups-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    # публикуем то, что собралось, даже если одна из систем не успела
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Сетапы ${{ steps.ver.outputs.v }}
          make_latest: true
          body: |
            Установщики приложения «Сетапы».
            • Windows 10/11 — Setups-Windows.exe
            • macOS (Intel и Apple Silicon) — Setups-Mac.dmg
            Первый запуск: Windows — «Подробнее» → «Выполнить в любом случае»; Mac — правый клик → «Открыть».
          files: out/*
